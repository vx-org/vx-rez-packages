name: Build and publish runtime packages

on:
  workflow_call:
    inputs:
      definition:
        description: Recipe path in the calling runtime repository
        required: false
        default: recipe.json
        type: string
      tooling-ref:
        description: Immutable vx-rez-packages commit containing this workflow and builder
        required: true
        type: string
      publish:
        description: Publish only after every native target has passed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REZ_SDK_VERSION: "0.3.10"

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Require immutable tooling
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
        working-directory: tooling
      - id: matrix
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
        run: |
          targets=$(vx uv run --locked python -m tools.ci_matrix --definition "$RECIPE")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: Native ${{ matrix.target.triple }}
    needs: matrix
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: ./tooling/.github/actions/native-environment
        id: native
        with:
          architecture: ${{ matrix.target.arch }}
          sdk-version: ${{ env.REZ_SDK_VERSION }}
      - name: Verify upstream, build Rez package and execute native smoke
        shell: bash
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
          TRIPLE: ${{ matrix.target.triple }}
          SDK_EXECUTABLE: ${{ steps.native.outputs.sdk-executable }}
        run: vx uv run --locked python -m tools.build_bundle --definition "$RECIPE" --triple "$TRIPLE" --sdk-executable "$SDK_EXECUTABLE" --output-dir ../dist
      - name: Prove public adapter activation against the actual built bundle
        shell: bash
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
          TRIPLE: ${{ matrix.target.triple }}
          CONSUMER_EXECUTABLE: ${{ steps.native.outputs.consumer-executable }}
        run: vx uv run --locked python -m tools.verify_consumer --definition "$RECIPE" --triple "$TRIPLE" --bundle-dir ../dist --consumer-executable "$CONSUMER_EXECUTABLE" --expected-sdk-version "$REZ_SDK_VERSION" --output ../receipts/native.json
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target.triple }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-consumer-${{ matrix.target.triple }}
          path: receipts/native.json
          if-no-files-found: error

  index:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
        working-directory: tooling
      - name: Generate complete index from verified bundle assets
        shell: bash
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          tag=$(vx uv run --locked python -m tools.release_tag --definition "$RECIPE")
          vx uv run --locked python -m tools.generate_index --definition "$RECIPE" --asset-dir ../dist --repository "$RELEASE_REPOSITORY" --release-tag "$tag" --output ../dist/index.json
      - name: Retain pinned originals and corresponding sources
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
        run: vx uv run --locked python -m tools.retain_release_assets --definition "$RECIPE" --output-dir ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: trusted-release-index
          path: dist/index.json*
          if-no-files-found: error

  publish:
    if: inputs.publish && github.event_name != 'pull_request'
    needs: index
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - uses: vx-org/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv gh
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
        working-directory: tooling
      - name: Create draft release after matching its source tag
        shell: bash
        working-directory: tooling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          RECIPE: ../recipe/${{ inputs.definition }}
        run: |
          tag=$(vx uv run --locked python -m tools.release_tag --definition "$RECIPE" --check "$RELEASE_REF")
          vx gh release create "$tag" ../dist/* --draft --repo "$RELEASE_REPOSITORY" --verify-tag --title "$tag" --notes "Native runtime Rez packages, index and SHA-256 companions. Upstream provenance and legal notices are included in every bundle."
      - name: Download and verify every uploaded draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          vx gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --dir uploaded
          vx uv run --locked python -m tools.verify_release --expected-dir ../dist --downloaded-dir uploaded
        working-directory: tooling
      - name: Make the fully verified draft public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: vx gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false
      - name: Read back public release metadata and checksum assets
        shell: bash
        working-directory: tooling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RECIPE: ../recipe/${{ inputs.definition }}
        run: vx uv run --locked python -m tools.generate_index --definition "$RECIPE" --github-release-tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output ../readback/index.json
      - name: Read back and verify every public runtime and source asset
        shell: bash
        working-directory: tooling
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          vx gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --dir public-readback
          vx uv run --locked python -m tools.verify_release --expected-dir ../dist --downloaded-dir public-readback

  public-consumer:
    name: Public acquisition ${{ matrix.target.triple }}
    if: inputs.publish && needs.publish.result == 'success'
    needs: [matrix, publish]
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/download-artifact@v8
        with:
          name: trusted-release-index
          path: trusted-release
      - uses: ./tooling/.github/actions/native-environment
        id: native
        with:
          architecture: ${{ matrix.target.arch }}
          sdk-version: ${{ env.REZ_SDK_VERSION }}
      - name: Acquire public bundles, activate natively and repeat from the offline cache
        shell: bash
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
          TRIPLE: ${{ matrix.target.triple }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          CONSUMER_EXECUTABLE: ${{ steps.native.outputs.consumer-executable }}
        run: |
          tag=$(vx uv run --locked python -m tools.release_tag --definition "$RECIPE")
          index_url="https://github.com/$RELEASE_REPOSITORY/releases/download/$tag/index.json"
          vx uv run --locked python -m tools.verify_consumer --definition "$RECIPE" --triple "$TRIPLE" --index-url "$index_url" --trusted-index ../trusted-release/index.json --cache "$RUNNER_TEMP/public-consumer-cache" --require-empty-cache --consumer-executable "$CONSUMER_EXECUTABLE" --expected-sdk-version "$REZ_SDK_VERSION" --output ../receipts/public.json
      - uses: actions/upload-artifact@v7
        with:
          name: public-consumer-${{ matrix.target.triple }}
          path: receipts/public.json
          if-no-files-found: error
