name: Build and publish runtime packages

on:
  workflow_call:
    inputs:
      definition:
        description: Recipe path in the calling runtime repository
        required: false
        default: recipe.json
        type: string
      tooling-ref:
        description: Immutable vx-rez-packages commit containing this workflow and builder
        required: true
        type: string
      publish:
        description: Publish only after every native target has passed
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Require immutable tooling
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: loonghao/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
        working-directory: tooling
      - id: matrix
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
        run: |
          targets=$(vx uv run --locked python -m tools.ci_matrix --definition "$RECIPE")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: Native ${{ matrix.target.triple }}
    needs: matrix
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target.arch == 'arm_64' && 'arm64' || 'x64' }}
      - uses: loonghao/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked --python "$PYTHON_PATH"
        shell: bash
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        working-directory: tooling
      - name: Verify upstream, build Rez package and execute native smoke
        shell: bash
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
          TRIPLE: ${{ matrix.target.triple }}
        run: vx uv run --locked python -m tools.build_bundle --definition "$RECIPE" --triple "$TRIPLE" --output-dir ../dist
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target.triple }}
          path: dist/*
          if-no-files-found: error

  index:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - uses: loonghao/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
        working-directory: tooling
      - name: Generate complete index from verified bundle assets
        shell: bash
        working-directory: tooling
        env:
          RECIPE: ../recipe/${{ inputs.definition }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          tag=$(vx uv run --locked python -c 'import json,os; d=json.load(open(os.environ["RECIPE"])); print(d["tool"]+"-"+d["version"])')
          vx uv run --locked python -m tools.generate_index --definition "$RECIPE" --asset-dir ../dist --repository "$RELEASE_REPOSITORY" --release-tag "$tag" --output ../dist/index.json
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish && github.event_name != 'pull_request'
    needs: index
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: recipe
      - uses: actions/checkout@v7
        with:
          repository: vx-org/vx-rez-packages
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - uses: loonghao/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: uv gh
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
        working-directory: tooling
      - name: Create draft release after matching its source tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          tag=$(vx uv run --project tooling --locked python -c 'import json; print(json.load(open("dist/index.json"))["release_tag"])')
          test "$RELEASE_REF" = "$tag"
          vx gh release create "$tag" dist/* --draft --repo "$RELEASE_REPOSITORY" --verify-tag --title "$tag" --notes "Native runtime Rez packages, index and SHA-256 companions. Upstream provenance and legal notices are included in every bundle."
      - name: Download and verify every uploaded draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          vx gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --dir uploaded
          vx uv run --locked python -m tools.verify_release --expected-dir ../dist --downloaded-dir uploaded
        working-directory: tooling
      - name: Make the fully verified draft public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: vx gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false
      - name: Read back public release metadata and checksum assets
        shell: bash
        working-directory: tooling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RECIPE: ../recipe/${{ inputs.definition }}
        run: vx uv run --locked python -m tools.generate_index --definition "$RECIPE" --github-release-tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output ../readback/index.json
