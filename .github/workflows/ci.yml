name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate schemas and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: loonghao/vx@b2c1ce558af4b516261f34a27eb0576a9bec45f1
        with:
          tools: "uv actionlint"
          cache: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: vx uv sync --locked
      - run: vx uv run --locked ruff format --check .
      - run: vx uv run --locked ruff check .
      - run: vx uv run --locked python -m unittest discover -s tests -v
      - run: vx actionlint
