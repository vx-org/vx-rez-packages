[package]
name = "pip4717-config-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
rez-next-config = { path = "rez-next-config" }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["rez-next-config"]
